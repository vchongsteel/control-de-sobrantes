<ion-content>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo">
      <div class="logos">
        <img src="assets/Logo/STEEL.jpeg" alt="STEEL" />
        <img src="assets/Logo/IEM.jpeg" alt="IEM" />
      </div>

      <h1 id="titulo">Nueva contraseña</h1>

      <p class="introduccion">
        Define una contraseña de al menos 8 caracteres.
      </p>

      <form
        #formulario="ngForm"
        (ngSubmit)="restablecer(formulario)"
        [hidden]="completado || !tieneToken"
      >
        <div class="campo">
          <label for="contrasena">Nueva contraseña</label>
          <div class="clave-con-ojo"><input
            id="contrasena"
            name="contrasena"
            type="password" #claveVisible1
            [(ngModel)]="contrasena"
            autocomplete="new-password"
            required
            minlength="8"
            [disabled]="cargando"
          /><button type="button" class="ojo-clave" (click)="claveVisible1.type = claveVisible1.type === 'password' ? 'text' : 'password'" [attr.aria-label]="claveVisible1.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="claveVisible1.type === 'text'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        </div>

        <div class="campo">
          <label for="confirmacion">Confirmar contraseña</label>
          <div class="clave-con-ojo"><input
            id="confirmacion"
            name="confirmacion"
            type="password" #claveVisible2
            [(ngModel)]="confirmacion"
            autocomplete="new-password"
            required
            minlength="8"
            [disabled]="cargando"
          /><button type="button" class="ojo-clave" (click)="claveVisible2.type = claveVisible2.type === 'password' ? 'text' : 'password'" [attr.aria-label]="claveVisible2.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="claveVisible2.type === 'text'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        </div>

        <button type="submit" [disabled]="cargando">
          {{ cargando ? 'GUARDANDO…' : 'CAMBIAR CONTRASEÑA' }}
        </button>
      </form>

      <p class="mensaje" role="status" [hidden]="!mensaje">
        {{ mensaje }}
      </p>

      <a routerLink="/recuperar-contrasena" class="volver">
        Solicitar otro enlace
      </a>

      <a routerLink="/login" class="volver">
        Volver a iniciar sesión
      </a>
    </section>
  </main>
</ion-content>
