<ion-content>
  <main class="registro-container">
    <section class="registro-card" aria-labelledby="registro-title">
      <div class="logos">
        <img src="assets/Logo/STEEL.jpeg" alt="STEEL" />
        <img src="assets/Logo/IEM.jpeg" alt="IEM" />
      </div>

      <h1 id="registro-title">Crear cuenta</h1>

      <p class="introduccion">
        Registra tus datos. Un administrador revisará
        tu solicitud y asignará tus permisos.
      </p>

      <form
        #formulario="ngForm"
        (ngSubmit)="registrar(formulario)"
        [hidden]="registrado"
      >
        <fieldset [disabled]="cargando">
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input
              id="nombre"
              name="nombre"
              [(ngModel)]="nombre"
              autocomplete="name"
              required
              minlength="2"
              maxlength="100"
            />
          </div>

          <div class="campo">
            <label for="usuario">Usuario</label>
            <input
              id="usuario"
              name="usuario"
              [(ngModel)]="usuario"
              autocomplete="username"
              required
              minlength="3"
              maxlength="50"
              pattern="[a-zA-Z0-9._-]{3,50}"
              aria-describedby="ayuda-usuario"
            />
            <small id="ayuda-usuario">
              Usa letras, números, punto, guion o guion bajo.
            </small>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input
              id="correo"
              name="correo"
              type="email"
              [(ngModel)]="correo"
              autocomplete="email"
              required
              email
              maxlength="254"
            />
          </div>

          <div class="campo">
            <label for="contrasena">Contraseña</label>
            <div class="clave-con-ojo"><input
              id="contrasena"
              name="contrasena"
              type="password" #claveVisible1
              [(ngModel)]="contrasena"
              autocomplete="new-password"
              required
              minlength="8"
              aria-describedby="ayuda-contrasena"
            /><button type="button" class="ojo-clave" (click)="claveVisible1.type = claveVisible1.type === 'password' ? 'text' : 'password'" [attr.aria-label]="claveVisible1.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="claveVisible1.type === 'text'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <small id="ayuda-contrasena">
              Usa al menos 8 caracteres.
            </small>
          </div>

          <div class="campo">
            <label for="confirmacion">Confirmar contraseña</label>
            <div class="clave-con-ojo"><input
              id="confirmacion"
              name="confirmacion"
              type="password" #claveVisible2
              [(ngModel)]="confirmarContrasena"
              autocomplete="new-password"
              required
              minlength="8"
            /><button type="button" class="ojo-clave" (click)="claveVisible2.type = claveVisible2.type === 'password' ? 'text' : 'password'" [attr.aria-label]="claveVisible2.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="claveVisible2.type === 'text'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          </div>

          <button type="submit" class="boton">
            {{ cargando ? 'REGISTRANDO…' : 'CREAR CUENTA' }}
          </button>
        </fieldset>
      </form>

      <p class="mensaje" role="status" [hidden]="!mensaje">
        {{ mensaje }}
      </p>

      <a routerLink="/login" class="volver">
        Volver a iniciar sesión
      </a>

      <p class="pie">STEEL · IEM Ingeniería Electromecánica</p>
    </section>
  </main>
</ion-content>
